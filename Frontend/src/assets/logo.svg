<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="globe-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="orbit-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(8, 7)">
    <!-- 3D Globe Sphere Base -->
    <circle cx="28" cy="28" r="23" fill="url(#globe-ocean)" />
    
    <!-- Globe Meridians & Latitudes -->
    <ellipse cx="28" cy="28" rx="23" ry="10" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.6" />
    <ellipse cx="28" cy="28" rx="10" ry="23" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.6" />
    <line x1="5" y1="28" x2="51" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <line x1="28" y1="5" x2="28" y2="51" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

    <!-- Outer Orbit Ring (AI Flight Path) -->
    <ellipse cx="28" cy="28" rx="26" ry="14" stroke="url(#orbit-ring)" stroke-width="3" transform="rotate(-30 28 28)" stroke-linecap="round" />
    
    <!-- Golden AI Spark Star (Top Right) -->
    <g transform="translate(42, 6)">
      <path d="M7,0 C7,4 4,7 0,7 C4,7 7,10 7,14 C7,10 10,7 14,7 C10,7 7,4 7,0 Z" fill="url(#gold-spark)" />
      <circle cx="7" cy="7" r="1.5" fill="#ffffff" />
    </g>

    <!-- Small Flight Arc Jet Dot -->
    <circle cx="48" cy="20" r="3" fill="#38bdf8" />
  </g>

  <!-- Safarni Wordmark & Subtitle -->
  <g transform="translate(74, 38)">
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a" letter-spacing="-0.02em">
      SAFARNI
    </text>
    <!-- Gold AI Star Dot above I -->
    <path d="M128,-26 C128,-23 126,-21 123,-21 C126,-21 128,-19 128,-16 C128,-19 130,-21 133,-21 C130,-21 128,-23 128,-26 Z" fill="url(#gold-spark)" />

    <!-- Subtitle Badge -->
    <text x="2" y="16" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#2563eb" letter-spacing="0.25em">
      AI TRAVEL COMPANION
    </text>
  </g>
</svg>
