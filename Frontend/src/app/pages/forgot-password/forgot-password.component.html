<app-password-recovery-shell [visualSrc]="visualSrc" [visualAlt]="'Passport and email illustration for password recovery'">
  <a class="recovery-brand" routerLink="/">Safarni</a>

  <h1 class="recovery-title">Reset your password</h1>
  <p class="recovery-copy">
    Enter the email associated with<br />
    your account and we'll send you<br />
    a secure reset link.
  </p>

  <form class="recovery-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="recovery-field">
      <label class="recovery-label" for="recovery-email">Email Address</label>
      <div class="recovery-input-wrap">
        <span class="recovery-input-icon" aria-hidden="true">
        </span>
        <input
          id="recovery-email"
          class="recovery-input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          placeholder="example@gmail.com"
          aria-describedby="recovery-email-error"
        />
      </div>

      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p id="recovery-email-error" class="recovery-field-error">
          Enter a valid email address.
        </p>
      }
    </div>

    <button class="recovery-primary-button" type="submit" [disabled]="isSubmitting">
      @if (isSubmitting) {
        <span class="recovery-button-spinner" aria-hidden="true"></span>
        Sending...
      } @else {
        Send Reset Link
      }
    </button>
  </form>

  @if (errorMessage) {
    <div class="recovery-alert" role="alert">{{ errorMessage }}</div>
  }

  <a class="recovery-back-link" routerLink="/login">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M19 12H5m6-6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Back to Login
  </a>
</app-password-recovery-shell>
