<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="icon-globe-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="icon-orbit-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="icon-gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- 3D Globe Sphere Base -->
  <circle cx="32" cy="32" r="26" fill="url(#icon-globe-ocean)" />
  
  <!-- Globe Meridians & Latitudes -->
  <ellipse cx="32" cy="32" rx="26" ry="11" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />
  <ellipse cx="32" cy="32" rx="11" ry="26" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#ffffff" stroke-width="1.8" opacity="0.75" />
  <line x1="32" y1="6" x2="32" y2="58" stroke="#ffffff" stroke-width="1.8" opacity="0.75" />

  <!-- Outer Orbit Ring (AI Flight Path) -->
  <ellipse cx="32" cy="32" rx="29" ry="16" stroke="url(#icon-orbit-ring)" stroke-width="3.5" transform="rotate(-30 32 32)" stroke-linecap="round" />
  
  <!-- Golden AI Spark Star (Top Right) -->
  <g transform="translate(46, 6)">
    <path d="M8,0 C8,5 5,8 0,8 C5,8 8,11 8,16 C8,11 11,8 16,8 C11,8 8,5 8,0 Z" fill="url(#icon-gold-spark)" />
    <circle cx="8" cy="8" r="2" fill="#ffffff" />
  </g>

  <!-- Small Flight Arc Jet Dot -->
  <circle cx="53" cy="24" r="3.5" fill="#38bdf8" />
</svg>
