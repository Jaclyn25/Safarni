<header [ngClass]="navbarBgClass" class="backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-sm transition-colors duration-300">
  <div
    class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
      <img src="assets/logo.svg" alt="Safarni AI Travel" class="h-10 md:h-11 w-auto" />
    </a>

    <!-- Desktop Nav -->
    <div class="hidden md:flex items-center gap-stack-lg">

      <nav class="flex gap-stack-lg">
        <a routerLink="/" routerLinkActive="text-primary font-semibold" [routerLinkActiveOptions]="{ exact: true }"
          class="text-label-md font-label-md text-on-surface-variant hover:opacity-80 transition-opacity">
          Explore
        </a>

        <a routerLink="/planner" routerLinkActive="text-primary font-semibold"
          class="text-label-md font-label-md text-on-surface-variant hover:opacity-80 transition-opacity">
          Planner
        </a>

        <a routerLink="/concierge" routerLinkActive="text-primary font-semibold"
          class="text-label-md font-label-md text-on-surface-variant hover:opacity-80 transition-opacity">
          AI Concierge
        </a>

        <a routerLink="/bookings" routerLinkActive="text-primary font-semibold"
          class="text-label-md font-label-md text-on-surface-variant hover:opacity-80 transition-opacity">
          Bookings
        </a>
      </nav>

      @if (!user) {

      <a routerLink="/login"
        class="bg-primary text-white px-5 py-2 rounded-full font-label-md text-label-md hover:opacity-90 transition-opacity">
        Sign In
      </a>

      } @else {

      <div class="flex items-center gap-3">

        <a routerLink="/profile" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">

          <div class="h-9 w-9 rounded-full bg-primary text-white flex items-center justify-center font-semibold">
            {{ user.fullName.charAt(0) }}
          </div>

          <div class="flex flex-col">
            <span class="text-label-md font-semibold">
              {{ user.fullName }}
            </span>

            <span class="text-xs text-on-surface-variant">
              {{ user.email }}
            </span>
          </div>

        </a>

        <button (click)="logout()" class="text-primary hover:underline transition-colors">
          Logout
        </button>

      </div>

      }

    </div>

    <!-- Mobile -->
    <div class="md:hidden flex items-center gap-3">

      @if (!user) {

      <a routerLink="/login" class="bg-primary text-white px-4 py-1.5 rounded-full font-label-sm text-label-sm">
        Sign In
      </a>

      } @else {

      <a routerLink="/profile"
        class="h-9 w-9 rounded-full bg-primary text-white flex items-center justify-center font-semibold cursor-pointer">
        {{ user.fullName.charAt(0) }}
      </a>

      }

    </div>

  </div>
</header>
