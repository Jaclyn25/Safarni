services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: safarni-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - safarni-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  safarni-qdrant-data:
