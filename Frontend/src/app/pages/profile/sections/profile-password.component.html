<section class="card" id="password">
  <h2><span class="material-symbols-outlined">lock</span> Change Password</h2>

  <div class="stack">
    <div class="field">
      <label for="currentPassword">Current Password</label>
      <input id="currentPassword" type="password" [(ngModel)]="currentPassword" [ngModelOptions]="{ standalone: true }" autocomplete="current-password" (keydown.enter)="$event.preventDefault()" />
    </div>

    <div class="field">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" [(ngModel)]="newPassword" [ngModelOptions]="{ standalone: true }" autocomplete="new-password" (ngModelChange)="onNewPasswordInput($event)" (keydown.enter)="$event.preventDefault()" />
      <ul class="password-checks">
        <li [class.password-checks__ok]="passwordChecks.length">8+ characters</li>
        <li [class.password-checks__ok]="passwordChecks.upper">Uppercase letter</li>
        <li [class.password-checks__ok]="passwordChecks.number">Number</li>
        <li [class.password-checks__ok]="passwordChecks.symbol">Special character</li>
      </ul>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" [ngModelOptions]="{ standalone: true }" autocomplete="new-password" (ngModelChange)="onConfirmPasswordInput($event)" (keydown.enter)="$event.preventDefault()" />
      <p class="field__error" *ngIf="passwordMatchState === 'mismatch'">Passwords do not match.</p>
    </div>

    <p class="field__error" *ngIf="passwordError()">{{ passwordError() }}</p>
    <p class="field__hint" *ngIf="passwordSuccess()">Password changed successfully.</p>
    <button type="button" class="btn btn--primary" [disabled]="isChangingPassword()" (click)="changePassword()">
      {{ isChangingPassword() ? 'Updating…' : 'Update Password' }}
    </button>
  </div>
</section>
