<section class="card" id="connected-accounts">
  <h2><span class="material-symbols-outlined">link</span> Connected Accounts</h2>
  <p class="card__hint">
    Sign-in options for your Safarni account. Use Google to sign in without a password.
  </p>

  <div class="accounts">
    <div class="account-row" *ngFor="let account of connectedAccounts; trackBy: trackByIndex">
      <div class="account-row__info">
        <div class="account-row__icon">
          <span class="material-symbols-outlined">{{ account.provider === 'google' ? 'g_translate' : 'thumb_up' }}</span>
        </div>
        <div>
          <p class="account-row__label">{{ account.label }}</p>
          <p class="account-row__status">{{ account.status }}</p>
        </div>
      </div>
      <button
        type="button"
        class="btn"
        [class.btn--primary]="account.connected"
        [class.btn--outline]="!account.connected"
        [disabled]="!account.available"
        [attr.aria-disabled]="!account.available"
      >
        {{ account.connected ? 'Primary' : (account.available ? 'Connect' : 'Coming soon') }}
      </button>
    </div>
  </div>
</section>
