<app-password-recovery-shell
  [visualSrc]="visualSrc"
  visualAlt="Successful password update illustration"
>
  <a class="recovery-brand" routerLink="/">Safarni</a>

  <div class="recovery-success-content">
    <h1 class="recovery-title">Password Updated!</h1>
    <p class="recovery-copy">
      You can now login using your<br />
      new password.
    </p>

    <a class="recovery-primary-button" routerLink="/login">Login</a>
  </div>
</app-password-recovery-shell>
