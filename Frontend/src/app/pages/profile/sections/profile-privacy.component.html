<section class="card" id="privacy">
  <h2><span class="material-symbols-outlined">shield_lock</span> Privacy</h2>
  <p class="card__hint">
    How Safarni collects, uses, and protects your data. Last updated
    <time>{{ lastUpdated }}</time>.
  </p>

  <div class="privacy-grid">
    <div class="info-tile" *ngFor="let item of intro">
      <span class="info-tile__icon material-symbols-outlined">{{ item.icon }}</span>
      <div>
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </div>
    </div>
  </div>

  <div class="stack" style="margin-top: 24px">
    <div class="card card--sub" *ngFor="let section of practices">
      <div class="card__header">
        <span class="material-symbols-outlined">{{ section.icon }}</span>
        <h3>{{ section.title }}</h3>
      </div>
      <ul class="privacy-list">
        <li *ngFor="let item of section.items">{{ item }}</li>
      </ul>
    </div>
  </div>

  <p class="card__hint" style="margin-top: 24px">
    Questions? Email <a href="mailto:privacy@safarni.example" class="link">privacy@safarni.example</a>
    — we respond within 30 days.
  </p>
</section>
