name: Build, test, publish and deploy to MonsterASP

on:
  push:
    branches:
      - main
      - jacqueline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend\Safarni.slnx --runtime win-x86

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build -- --configuration production

      - name: Test backend
        run: dotnet test backend\Safarni.slnx --configuration Release --no-restore

      - name: Publish backend
        run: >-
          dotnet publish backend\src\Safarni.API\Safarni.API.csproj
          --configuration Release
          --no-restore
          --runtime win-x86
          --self-contained false
          --output .\publish

      - name: Include Angular app in ASP.NET publish
        shell: pwsh
        run: |
          $frontendRoot = Join-Path $env:GITHUB_WORKSPACE 'Frontend\dist\safarni-angular\browser'
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'publish\wwwroot'

          if (-not (Test-Path -LiteralPath $frontendRoot)) {
            throw "Angular production output was not found at $frontendRoot"
          }

          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          Copy-Item -Path (Join-Path $frontendRoot '*') -Destination $publishRoot -Recurse -Force

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: .\publish\
          server-dir: ./
          log-level: minimal
